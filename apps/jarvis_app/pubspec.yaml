name: jarvis_app
description: Jarvis-style personal AI assistant for mobile and desktop.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  flutter_tts: ^4.2.3
  speech_to_text: ^7.1.0
  permission_handler: ^11.4.0
  provider: ^6.1.5
  google_fonts: ^6.2.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
